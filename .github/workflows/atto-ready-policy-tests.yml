name: Atto ready-cycle policy tests
on:
  pull_request:
    paths:
      - AGENTS.md
      - governance/atto-ready-four-party.mjs
      - tests/atto-ready-four-party.test.mjs
      - .github/workflows/atto-ready-policy-tests.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Execute policy regression tests
        shell: bash
        run: node --test tests/atto-ready-four-party.test.mjs
