name: Exact checkout physical-integrity negative tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  physical-preflight-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Test actual reusable-workflow script against isolated Git trees
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          gate="$tmp/extracted-gate.sh"
          awk '
            /^        run: \|$/ { inside=1; next }
            inside && /^          / { sub(/^          /, ""); print; next }
            inside { exit }
          ' .github/workflows/reusable-source-tree-preflight.yml > "$gate"
          [[ -s "$gate" ]] || { echo 'Failed to extract actual gate' >&2; exit 1; }
          bash -n "$gate"
          root="$tmp/repo"
          git init -q "$root"
          git -C "$root" config user.email "preflight@example.invalid"
          git -C "$root" config user.name "Physical integrity test"
          printf 'ignored.txt\n' > "$root/.gitignore"
          printf 'ok\n' > "$root/data.txt"
          mkdir -p "$root/nested"
          printf 'nested content\n' > "$root/nested/deep.txt"
          chmod 644 "$root/.gitignore" "$root/data.txt" "$root/nested/deep.txt"
          git -C "$root" add .
          git -C "$root" commit -qm fixture
          head="$(git -C "$root" rev-parse --verify HEAD)"
          tree="$(git -C "$root" rev-parse --verify 'HEAD^{tree}')"
          run_gate() {
            (cd "$root" &&
              EXPECTED_COMMIT="$head" EXPECTED_TREE="$tree" \
              RUNNER_TEMP="$tmp" GITHUB_OUTPUT="$tmp/outputs" bash "$gate") >/dev/null 2>&1
          }
          rejection_count=0
          reject() {
            if run_gate; then
              echo "FAIL: tampered checkout accepted: $1" >&2
              exit 2
            fi
            rejection_count=$((rejection_count + 1))
            echo "PASS: rejected $1"
          }
          run_gate || { echo 'FAIL: pristine checkout rejected' >&2; exit 3; }
          printf 'tampered\n' >> "$root/data.txt"
          reject tracked-content
          git -C "$root" checkout -q -- data.txt
          chmod 755 "$root/data.txt"
          reject file-mode
          chmod 644 "$root/data.txt"
          printf 'x\n' > "$root/untracked.txt"
          reject untracked
          rm "$root/untracked.txt"
          printf 'x\n' > "$root/ignored.txt"
          reject ignored
          rm "$root/ignored.txt"
          rm "$root/data.txt"
          ln -s .gitignore "$root/data.txt"
          reject symlink
          rm "$root/data.txt"
          git -C "$root" checkout -q -- data.txt
          # Parent symlink aliases identical bytes to demonstrate a real bypass
          # that leaf-only symlink detection would miss.
          cp -p "$root/nested/deep.txt" "$tmp/deep.txt"
          rm -r "$root/nested"
          ln -s "$tmp" "$root/nested"
          reject ancestor-symlink
          rm "$root/nested"
          mkdir "$root/nested"
          cp -p "$tmp/deep.txt" "$root/nested/deep.txt"
          rm "$root/nested/deep.txt"
          reject missing-tracked
          cp -p "$tmp/deep.txt" "$root/nested/deep.txt"
          if (cd "$root" &&
              EXPECTED_COMMIT=0000000000000000000000000000000000000000 EXPECTED_TREE="$tree" \
              RUNNER_TEMP="$tmp" GITHUB_OUTPUT="$tmp/outputs" bash "$gate") >/dev/null 2>&1; then
            echo 'FAIL: wrong commit accepted' >&2; exit 5
          fi
          rejection_count=$((rejection_count + 1))
          echo 'PASS: rejected wrong-commit'
          if (cd "$root" &&
              EXPECTED_COMMIT="$head" EXPECTED_TREE=0000000000000000000000000000000000000000 \
              RUNNER_TEMP="$tmp" GITHUB_OUTPUT="$tmp/outputs" bash "$gate") >/dev/null 2>&1; then
            echo 'FAIL: wrong tree accepted' >&2; exit 6
          fi
          rejection_count=$((rejection_count + 1))
          echo 'PASS: rejected wrong-tree'
          printf 'staged\n' > "$root/data.txt"
          git -C "$root" add data.txt
          reject index-drift
          git -C "$root" reset -q --hard HEAD
          run_gate || { echo 'FAIL: restored checkout rejected' >&2; exit 4; }
          [[ "$rejection_count" == 10 ]] || { echo "Expected 10 rejections, got $rejection_count" >&2; exit 7; }
          echo '10/10 adversarial negative controls passed; genuine compiler execution not tested'
