name: Actions execution receipt negative tests
on:
  pull_request:
  push:
permissions:
  contents: read
jobs:
  admission-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Execute fail-closed CI receipt negative tests
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/ci-evidence/test-verify-actions-admission.sh
