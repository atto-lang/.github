# Checkout-identity preflight only; NOT compiler execution, proof or attestation.
name: Reusable Oreslang exact-checkout preflight
on:
  workflow_call:
    inputs:
      expected_commit:
        required: true
        type: string
      expected_tree:
        required: true
        type: string
    outputs:
      checked_commit:
        description: Checked-out commit (identity only)
        value: ${{ jobs.identity.outputs.commit }}
      checked_tree:
        description: Checked-out Git tree (identity only)
        value: ${{ jobs.identity.outputs.tree }}
permissions:
  contents: read
jobs:
  identity:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      commit: ${{ steps.check.outputs.commit }}
      tree: ${{ steps.check.outputs.tree }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify exact checked-out commit and Git tree
        id: check
        shell: bash
        env:
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_TREE: ${{ inputs.expected_tree }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]] || exit 2
          [[ "$EXPECTED_TREE" =~ ^[0-9a-f]{40}$ ]] || exit 2
          commit="$(git rev-parse --verify HEAD)"
          tree="$(git rev-parse --verify 'HEAD^{tree}')"
          [[ "$commit" == "$EXPECTED_COMMIT" ]] || exit 3
          [[ "$tree" == "$EXPECTED_TREE" ]] || exit 3
          # Fail closed on index drift before considering physical checkout bytes.
          git diff --cached --quiet HEAD -- || { echo 'Index differs from HEAD' >&2; exit 4; }
          manifest="$(mktemp "${RUNNER_TEMP}/ores-preflight-manifest.XXXXXX")"
          extras="$(mktemp "${RUNNER_TEMP}/ores-preflight-extras.XXXXXX")"
          trap 'rm -f "$manifest" "$extras"' EXIT
          git ls-files --stage -z > "$manifest"
          [[ -s "$manifest" ]] || { echo 'Empty checkout manifest' >&2; exit 5; }
          files=0
          while IFS= read -r -d '' record; do
            [[ "$record" == *$'\t'* ]] || { echo 'Malformed Git index record' >&2; exit 6; }
            meta=${record%%$'\t'*}
            path=${record#*$'\t'}
            read -r mode expected_blob stage <<< "$meta"
            [[ "$mode" == 100644 || "$mode" == 100755 ]] || {
              echo "Reject symlink/submodule or unsafe mode: $mode" >&2
              exit 7
            }
            [[ "$stage" == 0 && "$expected_blob" =~ ^[0-9a-f]{40}$ ]] || {
              echo 'Unmerged or invalid index record' >&2; exit 8
            }
            [[ -f "$path" && ! -L "$path" ]] || {
              echo "Missing or symlinked physical file: $path" >&2; exit 9
            }
            # A tracked regular file can still be reached through a symlinked
            # ancestor directory. Reject every component, not just the leaf.
            parent="${path%/*}"
            while [[ "$parent" != "$path" && "$parent" != "." ]]; do
              [[ -d "$parent" && ! -L "$parent" ]] || {
                echo "Missing or symlinked ancestor directory: $parent" >&2
                exit 9
              }
              [[ "$parent" == */* ]] || break
              parent="${parent%/*}"
            done
            actual_mode="$(stat -c '%a' -- "$path")"
            expected_mode=644
            [[ "$mode" == 100755 ]] && expected_mode=755
            [[ "$actual_mode" == "$expected_mode" ]] || {
              echo "Physical file mode mismatch: $path" >&2; exit 10
            }
            actual_blob="$(git hash-object --no-filters -- "$path")"
            [[ "$actual_blob" == "$expected_blob" ]] || {
              echo "Physical file blob mismatch: $path" >&2; exit 11
            }
            files=$((files + 1))
          done < "$manifest"
          git ls-files --others --exclude-standard -z > "$extras"
          [[ ! -s "$extras" ]] || { echo 'Untracked files in checkout' >&2; exit 12; }
          git ls-files --others --ignored --exclude-standard -z > "$extras"
          [[ ! -s "$extras" ]] || { echo 'Ignored files in checkout' >&2; exit 13; }
          echo "Exact physical checkout checked: $files files"
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
          printf 'tree=%s\n' "$tree" >> "$GITHUB_OUTPUT"
