name: Review policy Rust conformance

on:
  pull_request:
    paths:
      - 'tools/merge-review-policy/**'
      - '.github/workflows/merge-review-policy-rust.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/merge-review-policy/**'
      - '.github/workflows/merge-review-policy-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Identify exact checkout tree
        run: |
          git rev-parse HEAD
          git rev-parse 'HEAD^{tree}'
      - name: Execute Rust policy unit tests
        run: cargo test --manifest-path tools/merge-review-policy/Cargo.toml --all-targets
      - name: Check Rust policy with clippy
        run: cargo clippy --manifest-path tools/merge-review-policy/Cargo.toml --all-targets -- -D warnings
