name: Review policy Rust conformance

on:
  pull_request:
    paths:
      - 'tools/merge-review-policy/**'
      - '.github/workflows/merge-review-policy-rust.yml'
  push:
    branches:
      - main
    paths:
      - 'tools/merge-review-policy/**'
      - '.github/workflows/merge-review-policy-rust.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-policy-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact PR tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # pull_request defaults to refs/pull/<N>/merge; never use that synthetic
          # merge commit as a substitute for the PR's exact submitted head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Assert exact submitted head and identify immutable tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          HEAD="$(git rev-parse HEAD)"
          test "${HEAD}" = "${EXPECTED_HEAD}"
          printf 'EXACT_HEAD_SHA=%s\n' "${HEAD}"
          printf 'EXACT_HEAD_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf 'RUN_ID=%s ATTEMPT=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
      # Preserve test execution receipts even if formatting is not yet clean.
      # All three remain required for the workflow to succeed.
      - name: Execute Rust policy unit tests
        run: cargo test --manifest-path tools/merge-review-policy/Cargo.toml --all-targets
      - name: Check Rust policy with clippy
        if: success() || failure()
        run: cargo clippy --manifest-path tools/merge-review-policy/Cargo.toml --all-targets -- -D warnings
      - name: Check Rust formatting
        if: success() || failure()
        run: cargo fmt --manifest-path tools/merge-review-policy/Cargo.toml --all -- --check
