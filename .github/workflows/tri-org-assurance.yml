name: Source-free tri-org assurance contracts
on:
  pull_request:
  workflow_dispatch:
permissions: {}
jobs:
  canary:
    name: public source-free runner canary
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: SOURCE_FREE_START
        run: echo SOURCE_FREE_START
      - name: SOURCE_FREE_END
        run: echo SOURCE_FREE_END
  contract-tests:
    name: exact-head negative security contract tests
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout exact immutable PR head
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Prove head SHA and clean tracked tree
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test -z "$(git status --porcelain)"
          test -z "$(git ls-files -s | awk '$1 == "120000" {print $4}')"
          git rev-parse HEAD^{tree}
      - name: Execute mandatory tests
        run: |
          node --check governance/tri-org-assurance.mjs
          node --check tests/tri-org-assurance.test.mjs
          node --test tests/tri-org-assurance.test.mjs
