name: Source-free GitHub Actions admission diagnostics (Rust)
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-free-gh-run-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # PR events default to synthetic merge trees; pin the submitted head.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind diagnostic execution to exact submitted head and tree
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          ACTUAL_HEAD="$(git rev-parse HEAD)"
          test "${ACTUAL_HEAD}" = "${EXPECTED_HEAD}"
          printf 'EXACT_HEAD=%s\n' "${ACTUAL_HEAD}"
          printf 'EXACT_TREE=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          printf 'RUN_ID=%s RUN_ATTEMPT=%s\n' "${GITHUB_RUN_ID}" "${GITHUB_RUN_ATTEMPT}"
      - name: Compile Rust diagnostic and run source-free tests
        shell: bash
        run: |
          set -euo pipefail
          rustc --edition=2021 -D warnings --test tools/gh_run_admission.rs -o /tmp/ores-gh-admission-test
          output=$(/tmp/ores-gh-admission-test)
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -q 'test result: ok. 22 passed; 0 failed'
          test -x /usr/bin/gh
          rustc --edition=2021 -D warnings tools/gh_run_admission.rs -o /tmp/ores-gh-admission
          if /tmp/ores-gh-admission ores-truffle-oreslang/oreslang-source.llvm 0 1; then
            echo "::error::Untrusted run identity accepted"
            exit 1
          fi
          if /tmp/ores-gh-admission untrusted/private 1 2; then
            echo "::error::Unapproved repository accepted"
            exit 1
          fi
          echo "SOURCE_FREE_RUST_ADMISSION_TOOL_TEST=PASS"
