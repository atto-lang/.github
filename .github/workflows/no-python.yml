name: Rust-only / no Python
on:
  workflow_call:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  prohibit-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Compile and test Rust policy gate
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustc --edition=2021 -D warnings --test tools/check_no_python.rs -o /tmp/check-no-python-tests
          /tmp/check-no-python-tests
          rustc --edition=2021 -D warnings tools/check_no_python.rs -o /tmp/check-no-python
      - name: Reject Python artifacts
        shell: bash
        run: |
          set -euo pipefail
          /tmp/check-no-python .
